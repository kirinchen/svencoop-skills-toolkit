// assault_pve - monster survival on cs_assault
map_script assault_pve

// starting loadout, CS style: knife + USP + $800 (money is handled by assault_pve.as)
// buy at spawn: bind b ".buy"   ammo: bind , ".buyammo1"  bind . ".buyammo2"
weapon_csknife
weapon_usp
weapon_medkit
ammo_usp 2

starthealth 100
startarmor 50
maxhealth 100
maxarmor 100

mp_timelimit 0
mp_fraglimit 0
mp_respawndelay 8
mp_multiplespawn 1
mp_weaponstay 1
mp_falldamage 1
mp_flashlight 1
mp_allowmonsterinfo 1
mp_noblastgibs 0
mp_banana 0
sv_ai_enemy_detection_mode 0
killnpc 1

// CS-ish movement
sv_gravity 800
sv_maxspeed 260
